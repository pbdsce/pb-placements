name: Deploy Prod and Staging

on:
  push:
    branches:
      - staging
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "env=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "domain=https://careers.pointblank.club" >> "$GITHUB_OUTPUT"
          else
            echo "domain=https://staging.careers.pointblank.club" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            hemang360/careers:${{ steps.meta.outputs.env }}
            hemang360/careers:${{ steps.meta.outputs.env }}-latest
            hemang360/careers:${{ steps.meta.outputs.env }}-${{ steps.meta.outputs.sha_short }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_DOMAIN=${{ steps.meta.outputs.domain }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update manifest in infra repo
        env:
          PAT: ${{ secrets.INFRA_PAT }}
        run: |
          ENV="${{ steps.meta.outputs.env }}"
          IMAGE_TAG="${ENV}-${{ steps.meta.outputs.sha_short }}"
          git clone https://${PAT}@github.com/pointblank-club/infra.git infra
          cd infra
          sed -i "s|image: hemang360/careers:.*|image: hemang360/careers:${IMAGE_TAG}|" \
            argocd/website/careers/${ENV}/deployment.yaml
          grep -q "image: hemang360/careers:${IMAGE_TAG}" \
            argocd/website/careers/${ENV}/deployment.yaml || { echo "ERROR: sed did not match"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/website/careers/${ENV}/deployment.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(${ENV}): update careers website image to ${IMAGE_TAG}"
          git pull --rebase
          git push
